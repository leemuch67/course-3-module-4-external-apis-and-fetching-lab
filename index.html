<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Active National Weather Service alerts by state." />
    <title>Weather Alerts</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <main class="app">
      <h1>Weather Alerts</h1>
      <p>Enter a U.S. state abbreviation to see active watches, warnings, and advisories.</p>

      <form id="alert-form">
        <label for="state-input">State abbreviation</label>
        <input
          id="state-input"
          type="text"
          placeholder="Enter state abbreviation"
          maxlength="2"
          autocomplete="off"
          aria-describedby="state-help"
        />
        <small id="state-help">For example: NY</small>
        <button id="fetch-alerts" type="submit">Get Weather Alerts</button>
      </form>

      <div id="error-message" class="hidden" role="alert"></div>
      <section id="alerts-display" aria-live="polite" aria-label="Weather alerts"></section>
    </main>
  </body>
</html>
